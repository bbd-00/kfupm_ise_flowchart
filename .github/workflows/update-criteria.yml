# Weekly: copy the technical-elective criteria from the ISE website into criteria.json,
# which the flowchart page shows in its "detailed criteria" pop-up.
name: Update technical elective criteria

on:
  schedule:
    - cron: "0 3 * * 0"   # Sundays 03:00 UTC (06:00 Saudi time)
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch criteria
        run: python scripts/fetch_criteria.py criteria.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- criteria.json && git ls-files --error-unmatch criteria.json >/dev/null 2>&1; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add criteria.json
          git commit -m "Update technical elective criteria from the ISE website"
          git push
